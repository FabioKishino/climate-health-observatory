version: 2

seeds:
  - name: municipalities
    description: >
      Reference data enriching municipality codes with a name, state, and
      coordinates. SIH-RD only carries the code
      (`municipality_residence_code`), not a name or coordinates, so this
      static lookup fills in the rest. Only holds Curitiba for now — add a
      row here for every municipality added to
      `DATASUS_MUNICIPALITY_IBGE_CODES` (see ingestion/datasus/config.py)
      when the project expands beyond Curitiba.
    config:
      column_types:
        ibge_code: varchar
        state: varchar
    columns:
      - name: ibge_code
        description: >
          Municipality code, in the 6-digit form SIH-RD's MUNIC_RES field
          actually uses — confirmed against a real download that DATASUS
          drops the 7th "check digit" the full official IBGE code carries
          (Curitiba is commonly quoted as IBGE code 4106902, but its
          MUNIC_RES value is "410690"). Despite the column name, this is
          not the complete IBGE code — kept for consistency with what
          every join in this project actually needs to match against.
        data_tests:
          - not_null
          - unique
      - name: municipality_name
        description: Municipality name.
      - name: state
        description: Two-letter state abbreviation.
      - name: latitude
        description: Municipality latitude (city centroid), in decimal degrees.
      - name: longitude
        description: Municipality longitude (city centroid), in decimal degrees.

  - name: municipality_station_mapping
    description: >
      Manual geographic proximity mapping from a municipality to its
      nearest INMET weather station, used by mart_climate_health_correlation
      to join climate to health data. This is a deliberate simplification
      for this phase (see docs/adr — a haversine-distance-based mapping is
      listed as suggested future work) rather than a computed distance.
      Curitiba maps to station A807, matching
      ingestion/inmet/config.py's INMET_STATION_CODES default.
    config:
      column_types:
        municipality_ibge_code: varchar
        station_code: varchar
    columns:
      - name: municipality_ibge_code
        description: >
          Municipality code (6-digit SIH-RD form — see the municipalities
          seed's ibge_code column) — matches dim_location.ibge_code.
        data_tests:
          - not_null
          - unique
      - name: station_code
        description: Nearest INMET station code — see dim_weather_station.station_code.
