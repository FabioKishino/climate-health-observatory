[tool.poetry]
name = "climate-health-observatory"
version = "0.1.0"
description = "Data engineering pipeline correlating INMET climate data with DataSUS/SIH-RD respiratory hospital admissions for Curitiba, Parana, Brazil."
authors = ["Fabio Kishino <fabiokishino@gmail.com>"]
readme = "README.md"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27"
pysus = "^2.11"
pandas = "^2.2"
duckdb = "^1.0"
dbt-core = "^1.8"
dbt-duckdb = "^1.8"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ingestion/tests"]
